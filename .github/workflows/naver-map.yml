name: Crawl Naver Maps

on:
  schedule:
    # Keep this intentionally low-frequency. Naver may throttle automated browser traffic.
    - cron: "37 */6 * * *"
  workflow_dispatch:
    inputs:
      query:
        description: "Optional single Naver Maps query"
        required: false
        type: string
      max_results:
        description: "Optional max places for the single query (1-30)"
        required: false
        type: string
      dry_run:
        description: "Print JSON only; do not write Firestore"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: leap-naver-map-crawler
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Crawl Naver Maps
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          NAVER_CRAWL_CONFIG_JSON: ${{ secrets.NAVER_CRAWL_CONFIG_JSON }}
          QUERY_INPUT: ${{ inputs.query }}
          MAX_RESULTS_INPUT: ${{ inputs.max_results }}
          DRY_RUN_INPUT: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "${QUERY_INPUT:-}" ]]; then
            args+=(--query "$QUERY_INPUT")
          fi
          if [[ -n "${MAX_RESULTS_INPUT:-}" ]]; then
            args+=(--max-results "$MAX_RESULTS_INPUT")
          fi
          if [[ "${DRY_RUN_INPUT:-false}" == "true" ]]; then
            args+=(--dry-run)
          fi
          python naver_map_crawler.py "${args[@]}"
